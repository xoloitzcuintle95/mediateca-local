[package]
name = "mediateca-local"
version = "0.1.0"
edition = "2024"
# Verified: `CARGO_TARGET_DIR=/tmp/target-193 cargo +1.93 check --locked` passes;
# 1.88 fails because libcosmic@1.0.0 (pinned rev) requires rustc 1.93.
rust-version = "1.93"
license = "MIT"
description = "Mediateca Local: a local media catalog for your music, videos and books."
repository = "https://github.com/xoloitzcuintle95/mediateca-local"

[dependencies]
dirs = "7"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
lofty = "0.25.5"
open = "5.4.5"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
rust-embed = "8.8.0"
rbook = { version = "0.7.12", default-features = false }
sha2 = "0.11.1"
tokio = { version = "1.48.0", features = ["full"] }
walkdir = "2.5"
mp4ameta = "0.13.0"
matroska = "0.30.1"

[dev-dependencies]
zip = { version = "9", default-features = false }

[build-dependencies]
xdgen = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Pinned for reproducible builds (Flatpak, CI).
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
